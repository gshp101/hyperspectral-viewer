[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hsview"
version = "0.2.0"
description = "View and annotate hyperspectral image cubes"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PyQt6>=6.5",
    "numpy",
    "matplotlib",
    "pillow",
    "spectral",
    "h5py",
    "hdf5storage",
    "tifffile",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-qt"]

[project.scripts]
hsview = "hsview.app:main"

[tool.setuptools.packages.find]
where = ["src"]
